[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qaldy-career-quest-api"
version = "0.1.0"
description = "Career Quest MVP API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "openai>=2.0.0,<3.0.0",
    "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
