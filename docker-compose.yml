services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-demo}
      ALLOW_INSECURE_DEMO_AUTH: ${ALLOW_INSECURE_DEMO_AUTH:-false}
      DEMO_HR_TOKEN: ${DEMO_HR_TOKEN:-local-demo-hr-token-2026}
      DEMO_EMPLOYEE_TOKENS: '${DEMO_EMPLOYEE_TOKENS:-{"E0001":"local-demo-employee-token-2026"}}'
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-01}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
      DATASET_DIR: /data/seed/career_quest_dataset
      DATABASE_URL: sqlite:////data/runtime/career_quest.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data/seed/career_quest_dataset:/data/seed/career_quest_dataset:ro
      - career_quest_runtime:/data/runtime
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:3000
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  career_quest_runtime:
